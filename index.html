<style>

    body *{ visibility:hidden; }

  .note-box{
    background: var(--sand-deep); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--ink-soft); margin-top:10px;

  .login-screen{
    position:fixed; inset:0; background: linear-gradient(180deg, var(--clay-dark) 0%, var(--clay) 55%, var(--sand) 55%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 30px; text-align:center; z-index: 500;
  }
  .login-screen h1{
    font-family:'Noto Nastaliq Urdu', serif; color:#fff; font-size:36px; margin:0 0 8px;
  }
  .login-screen .tag{ color:rgba(255,255,255,0.85); font-size:14px; margin-bottom:40px; }
  .login-card{
    background: var(--card); border-radius: 20px; padding: 28px 22px; width:100%; max-width:360px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }
  .login-card .icon{ font-size:44px; margin-bottom:10px; }
  .login-card h2{ font-family:'Noto Nastaliq Urdu', serif; font-size:20px; color:var(--clay-dark); margin:0 0 8px; }
  .login-card p{ font-size:14px; color:var(--ink-soft); margin:0 0 22px; line-height:1.8; }

    width:100%; padding:14px; border-radius:12px; border:2px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; gap:10px; font-weight:700; font-size:16px;
    color: var(--ink); cursor:pointer; font-family:'Noto Sans Arabic',sans-serif;

<body>
<div id="app"><div class="loading">لوڈ ہو رہا ہے…</div></div>

<script>
const STORAGE_KEYS = {
  workers: 'workers',
  kachi: 'kachi_entries',
  pakki: 'pakki_entries',
  nikasi: 'nikasi_entries',
  farokht: 'farokht_entries',
  masala: 'masala_entries',
  advances: 'worker_advances',
  buyers: 'buyers',
  settings: 'settings',
  bhatta_kharch: 'bhatta_kharch_entries',
  bookings: 'sale_bookings',
  salaried: 'salaried_employees',
  salary_payments: 'salary_payments',
  bharai: 'bharai_entries'
};

let DB = {
  workers: [],
  kachi_entries: [],
  pakki_entries: [],
  nikasi_entries: [],
  farokht_entries: [],
  masala_entries: [],
  worker_advances: [],
  buyers: [],
  settings: { rate_per_1000: 900, kiln_name: 'میرا بھٹہ', bharai_rate_per_1000: 350 },
  bhatta_kharch_entries: [],
  sale_bookings: [],
  salaried_employees: [],
  salary_payments: [],
  bharai_entries: []
};
const QUALITY_LABELS = {awal:'اول', dom:'دوم', barishi:'بارشی', khangar:'کھنگر'};

let currentTab = 'dashboard';
let uiState = {};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  const dt = new Date(d+(d.length===10?'T00:00:00':''));
  const months = ['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
  const days = ['اتوار','پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ'];
  return dt.getDate() + ' ' + months[dt.getMonth()] + ' ' + dt.getFullYear() + ' — ' + days[dt.getDay()];
}
function fmtDateShort(d){
  const dt = new Date(d+(d.length===10?'T00:00:00':''));
  const months = ['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
  return dt.getDate() + ' ' + months[dt.getMonth()] + ' ' + dt.getFullYear();
}
function fmtMoney(n){
  n = Math.round(n || 0);
  return n.toLocaleString('en-US') + ' روپے';
}
function fmtNum(n){
  return Math.round(n||0).toLocaleString('en-US');
}

async function loadAll(){
  for(const key of Object.values(STORAGE_KEYS)){
    try{
      const raw = localStorage.getItem('bhattaKhata_'+key);
      if(raw !== null){
        DB[key] = JSON.parse(raw);
      }
    }catch(e){ /* key not found yet, keep default */ }
  }
}
async function save(key){
  try{
    localStorage.setItem('bhattaKhata_'+key, JSON.stringify(DB[key]));
  }catch(e){
    console.error('save failed', key, e);
    showToast('محفوظ کرنے میں مسئلہ ہوا، دوبارہ کوشش کریں');
  }
  scheduleDriveBackup();
}

// ---------- Google Sign-In + Drive Backup ----------
const GOOGLE_CLIENT_ID = '38012722711-9e8tp0o1mfh4c5sbpsndec17s91q9g9n.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email';
const BACKUP_FILENAME = 'bhatta-khata-backup.json';
let gAccessToken = null;
let gDriveFileId = null;
let gUserEmail = null;
let gTokenClient = null;
let backupTimer = null;

function initGoogleClient(){
  if(typeof google === 'undefined' || !google.accounts){
    setTimeout(initGoogleClient, 300);
    return;
  }
  gTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp) => {
      if(resp.error){
        setLoginStatus('لاگ ان منسوخ ہو گیا، دوبارہ کوشش کریں۔');
        return;
      }
      gAccessToken = resp.access_token;
      await afterSignIn();
    }
  });
  const btn = document.getElementById('googleSignInBtn');
  if(btn) btn.disabled = false;
}
function setLoginStatus(msg){
  const el = document.getElementById('loginStatus');
  if(el) el.textContent = msg;
}
function signInWithGoogle(){
  if(!gTokenClient){ setLoginStatus('گوگل تیار ہو رہا ہے، ذرا انتظار کریں...'); return; }
  setLoginStatus('گوگل اکاؤنٹ منتخب کریں...');
  gTokenClient.requestAccessToken({prompt:'consent'});
}
async function afterSignIn(){
  setLoginStatus('آپ کا ڈیٹا لایا جا رہا ہے...');
  try{
    const infoRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: {Authorization: 'Bearer '+gAccessToken}
    });
    const info = await infoRes.json();
    gUserEmail = info.email || '';
  }catch(e){ /* not critical */ }

  await loadAll(); // load whatever is on this device first

  try{
    const found = await findExistingDriveBackup();
    if(found){
      const cloudData = await downloadDriveBackup();
      if(cloudData && typeof cloudData==='object'){
        Object.keys(STORAGE_KEYS).forEach(()=>{});
        for(const key of Object.values(STORAGE_KEYS)){
          if(cloudData[key] !== undefined){
            DB[key] = cloudData[key];
            localStorage.setItem('bhattaKhata_'+key, JSON.stringify(DB[key]));
          }
        }
      }
    } else {
      // first time backing up this device's data (if any) to Drive
      await uploadBackupToDrive();
    }
  }catch(e){
    console.error('drive sync error', e);
    showToast('گوگل ڈرائیو سے رابطے میں مسئلہ ہوا، فون میں موجود ڈیٹا دکھایا جا رہا ہے');
  }

  hideLoginScreen();
  render();
}
async function findExistingDriveBackup(){
  const q = encodeURIComponent(`name='${BACKUP_FILENAME}'`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name)`, {
    headers: {Authorization: 'Bearer '+gAccessToken}
  });
  if(!res.ok) throw new Error('drive list failed');
  const data = await res.json();
  if(data.files && data.files.length>0){
    gDriveFileId = data.files[0].id;
    return true;
  }
  return false;
}
async function downloadDriveBackup(){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${gDriveFileId}?alt=media`, {
    headers: {Authorization: 'Bearer '+gAccessToken}
  });
  if(!res.ok) throw new Error('drive download failed');
  return await res.json();
}
function scheduleDriveBackup(){
  if(!gAccessToken) return;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(uploadBackupToDrive, 1500);
}
async function uploadBackupToDrive(){
  if(!gAccessToken) return;
  const content = JSON.stringify(DB);
  try{
    if(gDriveFileId){
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${gDriveFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: {Authorization: 'Bearer '+gAccessToken, 'Content-Type':'application/json'},
        body: content
      });
    } else {
      const boundary = 'bhattaKhataBoundary';
      const metadata = {name: BACKUP_FILENAME, parents: ['appDataFolder'], mimeType:'application/json'};
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n`+
        `--${boundary}--`;
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: {Authorization: 'Bearer '+gAccessToken, 'Content-Type': `multipart/related; boundary=${boundary}`},
        body
      });
      const data = await res.json();
      if(data.id) gDriveFileId = data.id;
    }
  }catch(e){
    console.error('drive backup failed', e);
  }
}
function hideLoginScreen(){
  const el = document.getElementById('loginScreen');
  if(el) el.remove();
}
function signOutGoogle(){
  if(gAccessToken){
    try{ google.accounts.oauth2.revoke(gAccessToken, ()=>{}); }catch(e){}
  }
  gAccessToken = null;
  gDriveFileId = null;
  gUserEmail = null;
  location.reload();
}

let toastTimer=null;
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.className='toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

// ---------- Derived calculations ----------
function workerBalance(workerId){
  const earned = DB.kachi_entries.filter(e=>e.workerId===workerId).reduce((s,e)=>s+e.amount,0);
  const advanced = DB.worker_advances.filter(a=>a.workerId===workerId).reduce((s,a)=>s+a.amount,0);
  return earned - advanced; // positive = we owe worker, negative = worker owes us
}
function totalKachiQty(){ return DB.kachi_entries.reduce((s,e)=>s+e.qty,0); }
function totalPakkiQty(){ return DB.pakki_entries.reduce((s,e)=>s+e.qty,0); }
function totalNikasiQty(){ return DB.nikasi_entries.reduce((s,e)=>s+(e.awal||0)+(e.dom||0)+(e.barishi||0),0); }
function totalFarokhtQty(){ return DB.farokht_entries.reduce((s,e)=>s+e.qty,0); }
function totalFarokhtAmount(){ return DB.farokht_entries.reduce((s,e)=>s+e.total,0); }
function totalFarokhtReceived(){ return DB.farokht_entries.reduce((s,e)=>s+e.received,0); }
function totalBookingDeliveredQtyAll(){ return DB.sale_bookings.reduce((s,b)=>s+bookingDeliveredQty(b),0); }
function stockPakki(){ return totalNikasiQty() - totalFarokhtQty() - totalBookingDeliveredQtyAll(); }
function todayKachi(){ return DB.kachi_entries.filter(e=>e.date===todayStr()).reduce((s,e)=>s+e.qty,0); }
function masalaStock(){
  const purchased = DB.masala_entries.filter(m=>m.type==='purchase').reduce((s,m)=>s+m.qty,0);
  const used = DB.masala_entries.filter(m=>m.type==='use').reduce((s,m)=>s+m.qty,0);
  return purchased - used;
}
function masalaSpent(){
  return DB.masala_entries.filter(m=>m.type==='purchase').reduce((s,m)=>s+m.cost,0);
}
function totalAdvancesDue(){
  // sum of positive balances (we owe worker) - not needed globally but useful
  return DB.workers.reduce((s,w)=> {
    const b = workerBalance(w.id);
    return s + (b>0? b:0);
  },0);
}

// ---------- Nikasi (fired bricks removed, by quality) ----------
function nikasiTotals(){
  return DB.nikasi_entries.reduce((acc,e)=>{
    acc.awal += (e.awal||0); acc.dom += (e.dom||0); acc.barishi += (e.barishi||0); acc.khangar += (e.khangar||0);
    return acc;
  }, {awal:0,dom:0,barishi:0,khangar:0});
}
function qualityLabel(q){ return QUALITY_LABELS[q] || ''; }
function qualitySoldQty(q){
  const direct = DB.farokht_entries.filter(e=>e.quality===q).reduce((s,e)=>s+e.qty,0);
  const booked = DB.sale_bookings.filter(b=>b.quality===q).reduce((s,b)=>s+bookingDeliveredQty(b),0);
  return direct + booked;
}
function qualityStock(q){ const t = nikasiTotals(); return (t[q]||0) - qualitySoldQty(q); }

// ---------- Farokht (Sales) ----------
function buyerBalance(buyerId){
  const entries = DB.farokht_entries.filter(e=>e.buyerId===buyerId);
  const total = entries.reduce((s,e)=>s+e.total,0);
  const received = entries.reduce((s,e)=>s+e.received,0);
  return {total, received, due: total-received, count: entries.length};
}

  const entries = [...DB.farokht_entries].sort((a,b)=> b.date.localeCompare(a.date));
  return `

      <div class="stat"><span class="num" style="color:var(--bad)">${fmtMoney(totalFarokhtAmount()-totalFarokhtReceived())}</span><span class="lbl">باقی وصولی</span></div>

async function submitFarokht(){
  const qty = parseFloat(document.getElementById('fkQty').value);
  const price = parseFloat(document.getElementById('fkPrice').value);
  const received = parseFloat(document.getElementById('fkReceived').value)||0;
  const date = document.getElementById('fkDate').value || todayStr();
  const quality = uiState.fkQuality || 'awal';
  if(!uiState.fkBuyerId){ showToast('براہ کرم خریدار منتخب کریں یا نیا خریدار شامل کریں'); return; }
  if(!qty || qty<=0 || !price || price<=0){ showToast('براہ کرم تعداد اور قیمت درست لکھیں'); return; }
  const available = qualityStock(quality);
  if(qty > available){ showToast(`${qualityLabel(quality)} میں صرف ${fmtNum(available)} اینٹیں موجود ہیں`); return; }
  const buyer = DB.buyers.find(b=>b.id===uiState.fkBuyerId);
  const total = (qty/1000)*price;
  DB.farokht_entries.push({id:uid(), date, createdAt:Date.now(), buyerId:buyer.id, buyerName:buyer.name, quality, qty, price, total, received});
  await save('farokht_entries');
  closeModal();

  renderTab();
}

// ---------- Weekly (Thursday) Ledger ----------
function getThursdayOnOrBefore(dateStr){
  const dt = new Date(dateStr+'T00:00:00');
  const day = dt.getDay(); // Sun=0 ... Thu=4
  const diff = (day - 4 + 7) % 7;
  dt.setDate(dt.getDate() - diff);
  return dt.toISOString().slice(0,10);
}

function registerLine(kind, e){
  if(kind==='kachi'){
    return `<div class="list-item"><div><div class="li-main">${escapeHtml(e.workerName||'—')}</div><div class="li-sub">${fmtNum(e.qty)} اینٹیں بنائیں</div></div><div class="li-amt good">${fmtMoney(e.amount)}</div></div>`;
  }
  if(kind==='pakki'){
    return `<div class="list-item"><div><div class="li-main">${escapeHtml(e.workerName||'—')}</div><div class="li-sub">${fmtNum(e.qty)} اینٹیں بھٹے میں پہنچیں${e.rainDamage? ' • بارش سے خراب '+fmtNum(e.rainDamage):''}</div></div></div>`;
  }
  if(kind==='nikasi'){
    return `<div class="list-item"><div><div class="li-main">نکاسی</div><div class="li-sub">اول ${fmtNum(e.awal||0)} • دوم ${fmtNum(e.dom||0)} • بارشی ${fmtNum(e.barishi||0)}</div></div><div class="li-amt">${fmtNum((e.awal||0)+(e.dom||0)+(e.barishi||0))}</div></div>`;
  }
  if(kind==='farokht'){
    const due = e.total - e.received;
    const name = e.buyerName || e.buyer || 'گاہک';
    return `<div class="list-item"><div><div class="li-main">${escapeHtml(name)}</div><div class="li-sub">${fmtNum(e.qty)} اینٹیں${e.quality? ' ('+qualityLabel(e.quality)+')':''} • ${due>0? 'باقی '+fmtMoney(due) : 'مکمل وصول'}</div></div><div class="li-amt good">${fmtMoney(e.total)}</div></div>`;
  }
  return '';
}
function buildRegisterHtml(kind){
  const entriesMap = {kachi:DB.kachi_entries, pakki:DB.pakki_entries, nikasi:DB.nikasi_entries, farokht:DB.farokht_entries};
  const iconMap = {kachi:'🧱', pakki:'🔥', nikasi:'📤', farokht:'💰'};
  const entries = entriesMap[kind] || [];
  if(entries.length===0) return emptyState(iconMap[kind], 'ابھی کوئی ریکارڈ نہیں');
  const byDate = {};
  entries.forEach(e=>{ (byDate[e.date] = byDate[e.date] || []).push(e); });
  const dates = Object.keys(byDate).sort((a,b)=> b.localeCompare(a));
  return dates.map(d=>`
    <div class="section-title" style="font-size:15px; margin:14px 2px 6px;">${fmtDate(d)}</div>
    <div class="card" style="padding:4px 12px;">
      ${byDate[d].map(e=>registerLine(kind,e)).join('')}
    </div>
  `).join('');
}

function monthsElapsed(startDate){
  const s = new Date(startDate+'T00:00:00');
  const t = new Date();
  let months = (t.getFullYear()-s.getFullYear())*12 + (t.getMonth()-s.getMonth());
  if(t.getDate() < s.getDate()) months -= 1;
  return Math.max(0, months);
}
function salariedPaid(empId){ return DB.salary_payments.filter(p=>p.employeeId===empId).reduce((s,p)=>s+p.amount,0); }
function salariedDue(emp){ return (monthsElapsed(emp.start_date) * emp.monthly_salary) - salariedPaid(emp.id); }

// ---------- Report / PDF Export ----------
function fmtTime(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h>=12 ? 'شام' : 'صبح';
  h = h % 12; if(h===0) h = 12;
  return h + ':' + String(m).padStart(2,'0') + ' ' + ampm;
}
function dateRangeFor(period){
  const today = new Date();
  const toStr = (d)=> d.toISOString().slice(0,10);
  let start, end = toStr(today);
  if(period==='today'){ start = toStr(today); }
  else if(period==='this_week'){ const d=new Date(today); d.setDate(d.getDate()-6); start=toStr(d); }
  else if(period==='last_week'){ const e=new Date(today); e.setDate(e.getDate()-7); const s=new Date(e); s.setDate(s.getDate()-6); start=toStr(s); end=toStr(e); }
  else if(period==='this_month'){ const s=new Date(today.getFullYear(), today.getMonth(), 1); start=toStr(s); }
  else if(period==='last_month'){ const s=new Date(today.getFullYear(), today.getMonth()-1, 1); const e=new Date(today.getFullYear(), today.getMonth(), 0); start=toStr(s); end=toStr(e); }
  else if(period==='this_year'){ const s=new Date(today.getFullYear(),0,1); start=toStr(s); }
  else if(period==='ten_years'){ const s=new Date(today.getFullYear()-10, today.getMonth(), today.getDate()); start=toStr(s); }
  else if(period==='thursday'){ start = getThursdayOnOrBefore(toStr(today)); const e=new Date(start+'T00:00:00'); e.setDate(e.getDate()+6); end=toStr(e); }
  else { start = toStr(today); }
  return {start, end};
}
function computePeriodSummary(start,end){
  const inRange = (d)=> d>=start && d<=end;
  const kachiEntries = DB.kachi_entries.filter(e=>inRange(e.date));
  const pakkiEntries = DB.pakki_entries.filter(e=>inRange(e.date));
  const nikasiEntries = DB.nikasi_entries.filter(e=>inRange(e.date));
  const farokhtEntries = DB.farokht_entries.filter(e=>inRange(e.date));
  const masalaEntries = DB.masala_entries.filter(e=>inRange(e.date));
  const kharchEntries = DB.bhatta_kharch_entries.filter(e=>inRange(e.date));
  const bharaiEntries = DB.bharai_entries.filter(e=>inRange(e.date));
  const advanceEntries = DB.worker_advances.filter(e=>inRange(e.date));
  const salaryEntries = DB.salary_payments.filter(e=>inRange(e.date));
  return {
    kachiQty: kachiEntries.reduce((s,e)=>s+e.qty,0),
    kachiAmount: kachiEntries.reduce((s,e)=>s+e.amount,0),
    pakkiQty: pakkiEntries.reduce((s,e)=>s+e.qty,0),
    nikasiQty: nikasiEntries.reduce((s,e)=>s+(e.awal||0)+(e.dom||0)+(e.barishi||0)+(e.khangar||0),0),
    salesQty: farokhtEntries.reduce((s,e)=>s+e.qty,0),
    salesAmount: farokhtEntries.reduce((s,e)=>s+e.total,0),
    salesReceived: farokhtEntries.reduce((s,e)=>s+e.received,0),
    masalaPurchaseCost: masalaEntries.filter(e=>e.type==='purchase').reduce((s,e)=>s+e.cost,0),
    kharchTotal: kharchEntries.reduce((s,e)=>s+e.amount,0),
    bharaiAmount: bharaiEntries.reduce((s,e)=>s+e.amount,0),
    workerPayments: advanceEntries.reduce((s,e)=>s+e.amount,0),
    salaryPayments: salaryEntries.reduce((s,e)=>s+e.amount,0),
    kachiEntries, pakkiEntries, nikasiEntries, farokhtEntries, masalaEntries, kharchEntries, bharaiEntries, advanceEntries, salaryEntries
  };
}

function printableTable(title, rows, headers){
  if(rows.length===0) return '';
  let html = `<h3 style="font-family:'Noto Nastaliq Urdu',serif;">${title}</h3><table class="print-table"><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr>`;
  rows.forEach(r=>{ html += `<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`; });
  html += `</table>`;
  return html;
}
function printReport(start,end,label){
  const s = computePeriodSummary(start,end);
  let html = `
    <div style="text-align:center; margin-bottom:16px;">
      <h1 style="font-family:'Noto Nastaliq Urdu',serif; margin:0;">${escapeHtml(DB.settings.kiln_name||'بھٹہ کھاتہ')}</h1>

      <tr><td>کچی اینٹیں</td><td>${fmtNum(s.kachiQty)} اینٹیں — ${fmtMoney(s.kachiAmount)}</td></tr>

      <tr><td>نکاسی</td><td>${fmtNum(s.nikasiQty)}</td></tr>
      <tr><td>فروخت</td><td>${fmtNum(s.salesQty)} اینٹیں — ${fmtMoney(s.salesAmount)} (وصول ${fmtMoney(s.salesReceived)})</td></tr>
      <tr><td>مصالحہ خرچ</td><td>${fmtMoney(s.masalaPurchaseCost)}</td></tr>
      <tr><td>بٹہ خرچ</td><td>${fmtMoney(s.kharchTotal)}</td></tr>
      <tr><td>بھرائی مزدوری</td><td>${fmtMoney(s.bharaiAmount)}</td></tr>
      <tr><td>مزدوروں کو ادائیگیاں</td><td>${fmtMoney(s.workerPayments)}</td></tr>
      <tr><td>تنخواہیں</td><td>${fmtMoney(s.salaryPayments)}</td></tr>
    </table>
  `;
  html += printableTable('کچی ڈیلی کی اندراجات', s.kachiEntries.map(e=>[fmtDate(e.date),fmtTime(e.createdAt),escapeHtml(e.workerName||'—'),fmtNum(e.qty),fmtMoney(e.amount)]), ['تاریخ','وقت','مزدور','تعداد','رقم']);
  html += printableTable('پکی ڈیلی کی اندراجات', s.pakkiEntries.map(e=>[fmtDate(e.date),fmtTime(e.createdAt),escapeHtml(e.workerName||'—'),fmtNum(e.qty),fmtNum(e.rainDamage||0)]), ['تاریخ','وقت','مزدور','تعداد','بارش سے خراب']);
  html += printableTable('نکاسی کی اندراجات', s.nikasiEntries.map(e=>[fmtDate(e.date),fmtTime(e.createdAt),fmtNum(e.awal||0),fmtNum(e.dom||0),fmtNum(e.barishi||0),fmtNum(e.khangar||0)]), ['تاریخ','وقت','اول','دوم','بارشی','کھنگر']);
  html += printableTable('فروخت کی اندراجات', s.farokhtEntries.map(e=>[fmtDate(e.date),fmtTime(e.createdAt),escapeHtml(e.buyerName||e.buyer||'—'),fmtNum(e.qty),fmtMoney(e.total),fmtMoney(e.received)]), ['تاریخ','وقت','خریدار','تعداد','کل رقم','وصول شدہ']);
  html += printableTable('مصالحہ کی اندراجات', s.masalaEntries.map(e=>[fmtDate(e.date),fmtTime(e.createdAt),e.type==='purchase'?'خریداری':'استعمال',fmtNum(e.qty),fmtMoney(e.cost||0)]), ['تاریخ','وقت','قسم','مقدار (من)','رقم']);
  html += printableTable('بٹہ خرچ کی اندراجات', s.kharchEntries.map(e=>[fmtDate(e.date),fmtTime(e.createdAt),escapeHtml(e.category),fmtMoney(e.amount),escapeHtml(e.note||'')]), ['تاریخ','وقت','قسم','رقم','تفصیل']);
  html += printableTable('بھرائی کی اندراجات', s.bharaiEntries.map(e=>[fmtDate(e.date),fmtTime(e.createdAt),escapeHtml(e.workerName),fmtNum(e.qty),fmtMoney(e.amount)]), ['تاریخ','وقت','مزدور','تعداد','رقم']);
  html += printableTable('مزدوروں کی ادائیگیاں', s.advanceEntries.map(e=>{const w=DB.workers.find(x=>x.id===e.workerId); return [fmtDate(e.date),fmtTime(e.createdAt),escapeHtml(w?w.name:'—'),e.type==='payment'?'ادائیگی':'پیشگی',fmtMoney(e.amount)];}), ['تاریخ','وقت','مزدور','قسم','رقم']);
  html += printableTable('تنخواہوں کی ادائیگیاں', s.salaryEntries.map(e=>{const emp=DB.salaried_employees.find(x=>x.id===e.employeeId); return [fmtDate(e.date),fmtTime(e.createdAt),escapeHtml(emp?emp.name:'—'),fmtMoney(e.amount)];}), ['تاریخ','وقت','ملازم','رقم']);

  let area = document.getElementById('printArea');
  if(!area){
    area = document.createElement('div');
    area.id = 'printArea';
    area.className = 'print-area';
    document.body.appendChild(area);
  }
  area.innerHTML = html;
  setTimeout(()=>{
    window.print();
  }, 100);
}
window.addEventListener('afterprint', ()=>{
  const area = document.getElementById('printArea');
  if(area) area.innerHTML = '';
});

// ---------- Photo + Voice Note Attachments ----------
let mediaRecorder = null;
let recordedChunks = [];
function resetAttachments(){ uiState.attachPhoto = null; uiState.attachAudio = null; recordedChunks = []; }
function attachmentBlockHtml(){
  return `
    <label class="field-label">رسید کی تصویر (اختیاری)</label>
    <input type="file" id="attachPhotoInput" accept="image/*" capture="environment" style="display:none;" onchange="handleAttachPhoto(event)">
    <button type="button" class="big-btn secondary" onclick="document.getElementById('attachPhotoInput').click()">📷 تصویر شامل کریں</button>
    <div id="attachPhotoPreview"></div>
    <label class="field-label">وائس نوٹ (اختیاری)</label>
    <button type="button" class="big-btn secondary" id="attachAudioBtn" onclick="toggleVoiceRecording()">🎤 ریکارڈ کریں</button>
    <div id="attachAudioPreview"></div>
  `;
}
function handleAttachPhoto(event){
  const file = event.target.files[0];
  if(!file) return;
  if(file.size > 4*1024*1024){ showToast('تصویر بہت بڑی ہے، چھوٹی تصویر منتخب کریں'); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    uiState.attachPhoto = reader.result;
    const prev = document.getElementById('attachPhotoPreview');
    if(prev) prev.innerHTML = `<img src="${reader.result}" style="max-width:100%; border-radius:10px; margin-top:8px;">`;
  };
  reader.readAsDataURL(file);
}
async function toggleVoiceRecording(){
  const btn = document.getElementById('attachAudioBtn');
  if(mediaRecorder && mediaRecorder.state==='recording'){
    mediaRecorder.stop();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e)=>{ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(recordedChunks, {type:'audio/webm'});
      const reader = new FileReader();
      reader.onload = ()=>{
        uiState.attachAudio = reader.result;
        const prev = document.getElementById('attachAudioPreview');
        if(prev) prev.innerHTML = `<audio controls src="${reader.result}" style="width:100%; margin-top:8px;"></audio>`;
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t=>t.stop());
      if(btn) btn.textContent = '🎤 ریکارڈ کریں';
    };
    mediaRecorder.start();
    if(btn) btn.textContent = '⏹ روکیں (ریکارڈنگ جاری ہے)';
  }catch(e){
    showToast('مائیک کی اجازت نہیں مل سکی');
  }
}
function attachmentPreviewHtml(e){
  if(!e.imageData && !e.audioData) return '';
  let html = '<div style="margin-top:8px;">';
  if(e.imageData) html += `<img src="${e.imageData}" style="max-width:100%; border-radius:10px; margin-bottom:6px;">`;
  if(e.audioData) html += `<audio controls src="${e.audioData}" style="width:100%;"></audio>`;
  html += '</div>';
  return html;
}

// ---------- Generic helpers ----------
let pendingConfirmAction = null;
function askConfirm(message, actionFn){
  pendingConfirmAction = actionFn;
  openModal('تصدیق کریں', `
    <div class="note-box" style="font-size:15px;">${escapeHtml(message)}</div>
    <div class="row-flex" style="margin-top:16px;">
      <button class="big-btn secondary" onclick="pendingConfirmAction=null; closeModal();">منسوخ</button>
      <button class="big-btn" style="background:var(--bad);" onclick="runPendingConfirm()">تصدیق کریں</button>
    </div>
  `);
}
async function runPendingConfirm(){
  const fn = pendingConfirmAction;
  pendingConfirmAction = null;
  if(fn) await fn();
}
async function deleteEntry(key, id){
  askConfirm('کیا آپ واقعی یہ اندراج حذف کرنا چاہتے ہیں؟', async ()=>{
    DB[key] = DB[key].filter(e=>e.id!==id);
    await save(key);
    showToast('حذف ہو گیا');
    closeModal();
    renderTab();
  });
}
function emptyState(icon, text){
  return `<div class="empty"><span class="ic">${icon}</span>${text}</div>`;
}
function escapeHtml(s){
  if(!s) return '';
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Modal ----------
function openModal(title, bodyHtml){
  let ov = document.getElementById('modalOverlay');
  if(ov) ov.remove();
  ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modalOverlay';
  ov.onclick = (e)=>{ if(e.target===ov) closeModal(); };
  ov.innerHTML = `
    <div class="modal-sheet" style="position:relative;">
      <button class="close-x" style="background:rgba(43,36,28,0.1); color:var(--ink);" onclick="closeModal()">✕</button>
      <h3>${title}</h3>
      ${bodyHtml}
    </div>
  `;
  document.body.appendChild(ov);
}
function closeModal(){
  const ov = document.getElementById('modalOverlay');
  if(ov) ov.remove();
}

// ---------- Settings ----------
function openSettings(){
  openModal('ترتیبات', `
    <label class="field-label">بھٹے کا نام</label>
    <input type="text" id="setKilnName" value="${escapeHtml(DB.settings.kiln_name||'')}">
    <label class="field-label">مزدوروں کا ریٹ فی ہزار اینٹ (کچی ڈیلی)</label>
    <input type="number" id="setRate" value="${DB.settings.rate_per_1000}" inputmode="numeric">
    <label class="field-label">بھرائی کا ریٹ فی ہزار اینٹ</label>
    <input type="number" id="setBharaiRate" value="${DB.settings.bharai_rate_per_1000||350}" inputmode="numeric">
    <button class="big-btn" style="margin-top:16px" onclick="submitSettings()">محفوظ کریں</button>
    <div class="divider"></div>
    <div class="note-box">${gUserEmail? 'اکاؤنٹ: '+escapeHtml(gUserEmail) : ''} آپ کا ڈیٹا اس فون میں اور گوگل ڈرائیو میں محفوظ ہے۔ نیا فون لینے پر اسی جی میل سے لاگ ان کر کے ڈیٹا واپس مل جائے گا۔</div>
    <button class="big-btn secondary" style="margin-top:14px;" onclick="signOutGoogle()">لاگ آؤٹ کریں</button>
  `);
}
async function submitSettings(){
  const name = document.getElementById('setKilnName').value.trim();
  const rate = parseFloat(document.getElementById('setRate').value);
  const bharaiRate = parseFloat(document.getElementById('setBharaiRate').value);
  if(!rate || rate<=0){ showToast('درست ریٹ لکھیں'); return; }
  if(!bharaiRate || bharaiRate<=0){ showToast('بھرائی کا درست ریٹ لکھیں'); return; }
  DB.settings.kiln_name = name || 'میرا بھٹہ';
  DB.settings.rate_per_1000 = rate;
  DB.settings.bharai_rate_per_1000 = bharaiRate;
  await save('settings');
  closeModal();
  showToast('ترتیبات محفوظ ہو گئیں');
  render();
}
